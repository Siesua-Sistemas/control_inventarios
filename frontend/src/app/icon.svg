<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo redondeado cyan oscuro -->
  <rect width="32" height="32" rx="7" fill="#0e7490"/>

  <!-- Cubo isométrico: cara superior (más clara) -->
  <polygon points="16,4 27,10 16,16 5,10" fill="white" opacity="0.95"/>

  <!-- Cara izquierda (más oscura) -->
  <polygon points="5,10 16,16 16,27 5,21" fill="white" opacity="0.50"/>

  <!-- Cara derecha (intermedia) -->
  <polygon points="27,10 16,16 16,27 27,21" fill="white" opacity="0.72"/>

  <!-- Bordes sutiles para separar las caras -->
  <polyline points="5,10 16,4 27,10 27,21 16,27 5,21 5,10"
            fill="none" stroke="#0e7490" stroke-width="0.4" opacity="0.35"/>
  <line x1="16" y1="4"  x2="16" y2="16" stroke="#0e7490" stroke-width="0.4" opacity="0.35"/>
  <line x1="5"  y1="10" x2="27" y2="10" stroke="#0e7490" stroke-width="0.4" opacity="0.35"/>
  <line x1="16" y1="16" x2="16" y2="27" stroke="#0e7490" stroke-width="0.4" opacity="0.35"/>
</svg>
